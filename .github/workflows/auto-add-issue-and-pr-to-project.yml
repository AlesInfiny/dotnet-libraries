name: Add new issue/PR to project

on:
  issues:
    types:
      - opened

  pull_request_target:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue or PR to project
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTO_ADD_ISSUE_AND_PR_TO_PROJECT_APP_ID }}
          private-key: ${{ secrets.AUTO_ADD_ISSUE_AND_PR_TO_PROJECT_APP_PEM }}

      - name: Add to Project
        env:
          TOKEN: ${{ steps.generate-token.outputs.token }}
        uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: ${{ secrets.PACKAGE_DEV_PROJECT_URL }}
          github-token: ${{ env.TOKEN }}
